# Remembers the idle timeout that was set by hand, so the cooldown can put it back.
#
# A macro cannot read the idle timeout in force, only the configured one. This file
# wraps SET_IDLE_TIMEOUT (rename_existing) and records every value set outside the
# cooldown in _COOLDOWN_VARS user_idle_timeout. START_COOLDOWN then extends from that
# value and the cooldown hands it back when the heater is released. The recorded value
# is lost on a Klipper restart, as the timeout itself is.
#
# Only one config can rename SET_IDLE_TIMEOUT. If another file of yours already does,
# remove the [include idle_timeout_tracking.cfg] line from cooldown.cfg. The cooldown
# then works from the configured timeout, as before.
[gcode_macro SET_IDLE_TIMEOUT]
rename_existing: SET_IDLE_TIMEOUT_BASE
description: Set the idle timeout (TIMEOUT in seconds). The cooldown remembers it and never shortens its own extension.
gcode:
  {% set cv = printer["gcode_macro _COOLDOWN_VARS"] %}
  {% set asked = params.TIMEOUT|default('')|string %}
  {% set seconds = asked|float(0) %}
  {% if params.COOLDOWN|default('')|string %}
    # The cooldown's own change: pass it on without recording it.
    SET_IDLE_TIMEOUT_BASE TIMEOUT={asked}
  {% elif not (0 < seconds < 100000000) %}
    # No or invalid TIMEOUT: Klipper reports it.
    SET_IDLE_TIMEOUT_BASE {% if asked %}TIMEOUT={asked}{% endif %}
  {% else %}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=user_idle_timeout VALUE={seconds}
    {% if cv.idle_timeout_extended|int and seconds < cv.extended_idle_timeout %}
      # A running cooldown needs the longer timeout. The value asked for comes back afterwards.
      RESPOND PREFIX="⏱️" MSG="Idle timeout kept at { '%.0f' % cv.extended_idle_timeout } s while the cooldown runs, then set to { '%.0f' % seconds } s"
      SET_IDLE_TIMEOUT_BASE TIMEOUT={cv.extended_idle_timeout}
    {% else %}
      SET_IDLE_TIMEOUT_BASE TIMEOUT={asked}
    {% endif %}
  {% endif %}

[gcode_macro _COOLDOWN_PROFILES]
# Material-to-profile assignments live in materials.cfg; notes below list them.
variable_profiles:
  # -------------------PHASE 1-----------------------
  # "chamber_hold_minutes"        # How long the heater keeps its print target (0 = skip)
  #
  # -------------------PHASE 2-----------------------
  # "chamber_target_temp"         # Temp to ramp down to, 0 or more (0 = skip ramp)
  # "cooldown_ramp_step_c"        # Degrees per step, above 0 when ramping (e.g. 1)
  # "cooldown_ramp_step_seconds"  # Seconds per step, 5 or more when ramping (e.g. 120)
  #
  # -------------------PHASE 3-----------------------
  # "passive_rest_minutes"        # Heater OFF; exhaust OFF when above 0 (0 = skip)
  #
  # -------------------PHASE 4-----------------------
  # "exhaust_enable"              # True / False (text or None is refused); False runs phase 4 at speed 0
  # "exhaust_fan_speed"           # 0.0 to 1.0, also applied to external_pc and bed_fans
  #
  # Every value except exhaust_enable must be present and a number, not text (no quotes).
  # START_COOLDOWN refuses the profile otherwise. Minutes may be fractional (0.5).
  #
  # Phase 5 waits for chamber and bed at or below _COOLDOWN_VARS chamber_cooled_temp.
  {

    # ----------------------------------------------------------
    # Long hold, controlled cooldown, NO exhaust
    # Mapped: PA, PA6, PA6CF, PACF
    # ----------------------------------------------------------
    "HOLD_120M_COOL_NO_EX": {
      "chamber_hold_minutes":       120,
      "chamber_target_temp":        42,
      "cooldown_ramp_step_c":       1,
      "cooldown_ramp_step_seconds": 120,
      "passive_rest_minutes":       0,
      "exhaust_enable":             False,
      "exhaust_fan_speed":          0.0
    },

    # ----------------------------------------------------------
    # Medium hold, controlled cooldown, exhaust after cooldown
    # Mapped: ABS, ABSCF, ASA, ASACF, ASAGF, PA12
    # ----------------------------------------------------------
    "HOLD_60M_COOL_EX": {
      "chamber_hold_minutes":       60,
      "chamber_target_temp":        42,
      "cooldown_ramp_step_c":       1,
      "cooldown_ramp_step_seconds": 120,
      "passive_rest_minutes":       0,
      "exhaust_enable":             True,
      "exhaust_fan_speed":          1.0
    },

    # ----------------------------------------------------------
    # Shorter controlled cooldown with exhaust
    # Not mapped to a material; use START_COOLDOWN PROFILE=HOLD_30M_COOL_EX
    # ----------------------------------------------------------
    "HOLD_30M_COOL_EX": {
      "chamber_hold_minutes":       30,
      "chamber_target_temp":        42,
      "cooldown_ramp_step_c":       1,
      "cooldown_ramp_step_seconds": 120,
      "passive_rest_minutes":       0,
      "exhaust_enable":             True,
      "exhaust_fan_speed":          1.0
    },

    # ----------------------------------------------------------
    # No hold, no controlled cooldown, passive equalization only
    # Mapped: DEFAULT and unknown materials, PC, PCABS, PCABSCF, PCCF,
    # PCTG, PETG, PETGCF, HIPS
    # ----------------------------------------------------------
    "PASSIVE_ONLY": {
      "chamber_hold_minutes":       0,
      "chamber_target_temp":        0,
      "cooldown_ramp_step_c":       0,
      "cooldown_ramp_step_seconds": 0,
      "passive_rest_minutes":       0,
      "exhaust_enable":             False,
      "exhaust_fan_speed":          0.0
    },

    # ----------------------------------------------------------
    # Heater off, short rest, then exhaust
    # Mapped: TPU72D, TPU90A, TPU95A
    # ----------------------------------------------------------
    "REST_5M_THEN_EX": {
      "chamber_hold_minutes":       0,
      "chamber_target_temp":        0,
      "cooldown_ramp_step_c":       0,
      "cooldown_ramp_step_seconds": 0,
      "passive_rest_minutes":       5,
      "exhaust_enable":             True,
      "exhaust_fan_speed":          1.0
    },

    # ----------------------------------------------------------
    # Heater off, exhaust immediately
    # Mapped: PLA, PLA+, PLACF
    # ----------------------------------------------------------
    "IMMEDIATE_EX": {
      "chamber_hold_minutes":       0,
      "chamber_target_temp":        0,
      "cooldown_ramp_step_c":       0,
      "cooldown_ramp_step_seconds": 0,
      "passive_rest_minutes":       0,
      "exhaust_enable":             True,
      "exhaust_fan_speed":          1.0
    }
  }
gcode:

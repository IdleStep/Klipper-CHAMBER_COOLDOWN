[gcode_macro _COOLDOWN_PROFILES]
variable_filament_table:
  # -------------------PHASE 1-----------------------
  # "chamber_hold_minutes"      # How long heater actively holds temp (0 = skip)
  #
  # -------------------PHASE 2-----------------------
  # "chamber_target_temp"      # Temp to ramp down to (null = skip ramp)
  # "cooldown_ramp_step_c"           # Degrees per step (e.g. 1)
  # "cooldown_ramp_step_seconds"     # Seconds per step (e.g. 120)
  #
  # -------------------PHASE 3-----------------------
  # "passive_rest_minutes"      # Heater OFF, exhaust OFF (0 = skip)
  #
  # -------------------PHASE 4-----------------------
  # "exhaust_enable"            # true / false
  # "exhaust_fan_speed"         # 0.0 to 1.0
  # "chamber_cooled_temp"      # Temperature to disable any exhaust and cooldown is complete
  {

    # ----------------------------------------------------------
    # Long hold, controlled cooldown, NO exhaust
    # High-warp materials (CF PC, specialty nylons)
    # ----------------------------------------------------------
    "HOLD_120M_COOL_NO_EX": {
      "chamber_hold_minutes":    120,
      "chamber_target_temp":    42,
      "cooldown_ramp_step_c":         1,
      "cooldown_ramp_step_seconds":   120,
      "passive_rest_minutes":    0,
      "exhaust_enable":          False,
      "exhaust_fan_speed":       0.0
    },

    # ----------------------------------------------------------
    # Medium hold, controlled cooldown, exhaust after cooldown
    # ABS / ASA / PC blends
    # ----------------------------------------------------------
    "HOLD_60M_COOL_EX": {
      "chamber_hold_minutes":    60,
      "chamber_target_temp":    42,
      "cooldown_ramp_step_c":         1,
      "cooldown_ramp_step_seconds":   120,
      "passive_rest_minutes":    0,
      "exhaust_enable":          True,
      "exhaust_fan_speed":       1.0
    },

    # ----------------------------------------------------------
    # Shorter controlled cooldown with exhaust
    # Slightly less warp-sensitive engineering plastics
    # ----------------------------------------------------------
    "HOLD_30M_COOL_EX": {
      "chamber_hold_minutes":    30,
      "chamber_target_temp":    42,
      "cooldown_ramp_step_c":         1,
      "cooldown_ramp_step_seconds":   120,
      "passive_rest_minutes":    0,
      "exhaust_enable":          True,
      "exhaust_fan_speed":       1.0
    },

    # ----------------------------------------------------------
    # No hold, no controlled cooldown, passive equalization only
    # PETG-CF, low-stress prints
    # ----------------------------------------------------------
    "PASSIVE_ONLY": {
      "chamber_hold_minutes":    0,
      "chamber_target_temp":    0,
      "cooldown_ramp_step_c":         0,
      "cooldown_ramp_step_seconds":   0,
      "passive_rest_minutes":    0,
      "exhaust_enable":          False,
      "exhaust_fan_speed":       0.0
    },

    # ----------------------------------------------------------
    # Heater off, short rest, then exhaust
    # PETG, HIPS, TPU
    # ----------------------------------------------------------
    "REST_5M_THEN_EX": {
      "chamber_hold_minutes":    0,
      "chamber_target_temp":    0,
      "cooldown_ramp_step_c":         0,
      "cooldown_ramp_step_seconds":   0,
      "passive_rest_minutes":    5,
      "exhaust_enable":          True,
      "exhaust_fan_speed":       1.0
    },

    # ----------------------------------------------------------
    # Heater off, exhaust immediately
    # PLA and variants
    # ----------------------------------------------------------
    "IMMEDIATE_EX": {
      "chamber_hold_minutes":    0,
      "chamber_target_temp":    0,
      "cooldown_ramp_step_c":         0,
      "cooldown_ramp_step_seconds":   0,
      "passive_rest_minutes":    0,
      "exhaust_enable":          True,
      "exhaust_fan_speed":       1.0
    }
  }
gcode:

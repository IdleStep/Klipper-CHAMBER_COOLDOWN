# Material name to cooldown profile (profiles.cfg). COOLDOWN_SELECT upper-cases
# the material; materials not listed here use DEFAULT.
[gcode_macro _COOLDOWN_MATERIALS]
variable_filament_table:
  {
    "DEFAULT": "PASSIVE_ONLY",
    "ABS":     "HOLD_60M_COOL_EX",
    "ABSCF":   "HOLD_60M_COOL_EX",
    "ASA":     "HOLD_60M_COOL_EX",
    "ASACF":   "HOLD_60M_COOL_EX",
    "ASAGF":   "HOLD_60M_COOL_EX",
    "HIPS":    "PASSIVE_ONLY",
    "PA":      "HOLD_120M_COOL_NO_EX",
    "PA12":    "HOLD_60M_COOL_EX",
    "PA6":     "HOLD_120M_COOL_NO_EX",
    "PA6CF":   "HOLD_120M_COOL_NO_EX",
    "PACF":    "HOLD_120M_COOL_NO_EX",
    "PC":      "PASSIVE_ONLY",
    "PCABS":   "PASSIVE_ONLY",
    "PCABSCF": "PASSIVE_ONLY",
    "PCCF":    "PASSIVE_ONLY",
    "PCTG":    "PASSIVE_ONLY",
    "PETG":    "PASSIVE_ONLY",
    "PETGCF":  "PASSIVE_ONLY",
    "PLA":     "IMMEDIATE_EX",
    "PLA+":    "IMMEDIATE_EX",
    "PLACF":   "IMMEDIATE_EX",
    "TPU72D":  "REST_5M_THEN_EX",
    "TPU90A":  "REST_5M_THEN_EX",
    "TPU95A":  "REST_5M_THEN_EX"
  }
gcode:

[gcode_macro COOLDOWN_SELECT]
description: Select cooldown profile by material
gcode:
  {% set material = params.MATERIAL|default('DEFAULT')|string|upper %}
  {% set table = printer["gcode_macro _COOLDOWN_MATERIALS"].filament_table %}
  {% set profile = table.get(material, table.DEFAULT|default('PASSIVE_ONLY')) %}
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=cooldown_profile VALUE="'{profile}'"
